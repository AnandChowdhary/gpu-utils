[project]
name = "gpu_view-training"
version = "0.0.0"
description = "Training pipeline for gpu-view"
requires-python = ">=3.12"
dependencies = [
  "gpu-utils-training",
]

# gpu-utils-training pulls in torch (CPU wheels on Linux), numpy and wgpu; the index below
# keeps torch on the CPU index when uv resolves it for this project.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
gpu-utils-training = { path = "../../../tooling/python", editable = true }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpu_view"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
