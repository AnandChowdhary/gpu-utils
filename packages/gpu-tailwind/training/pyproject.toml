[project]
name = "gpu_tailwind-training"
version = "0.0.0"
description = "Training pipeline for gpu-tailwind"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.6,<3",
  "numpy>=2",
  "gpu-utils-training",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
gpu-utils-training = { path = "../../../tooling/python", editable = true }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpu_tailwind"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
