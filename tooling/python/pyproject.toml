[project]
name = "gpu-utils-training"
version = "0.0.0"
description = "Shared training helpers for gpu-utils: tokenizer/featurizer parity, int6 export"
requires-python = ">=3.12"
dependencies = ["numpy>=2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpu_utils_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
